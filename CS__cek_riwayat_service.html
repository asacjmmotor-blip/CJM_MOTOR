<form action="#" class="flex flex-col gap-6" method="GET" onsubmit="event.preventDefault(); handleSearch();">
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant text-center" for="nopol">MASUKKAN NOMOR POLISI</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="pin_drop">pin_drop</span>
<input autocomplete="off" class="nopol-input w-full h-[48px] border border-outline-variant rounded-[8px] px-12 bg-surface font-headline-md text-headline-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="nopol" name="nopol" placeholder="Contoh: B 1234 ABC" required="" type="text"/>
</div>
<p class="font-body-sm text-body-sm text-status-danger hidden text-center mt-1" id="error-message">Format Nomor Polisi tidak valid.</p>
</div>
<button class="h-[48px] bg-primary text-on-primary rounded-[8px] font-headline-md text-headline-md flex items-center justify-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-colors active:scale-[0.98]" id="search-btn" type="submit">

<script>
        function handleSearch() {
            const btn = document.getElementById('search-btn');
            const originalContent = btn.innerHTML;
            
            // Loading state
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span><span>Mencari...</span>`;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            btn.disabled = true;

            // Simulate API call
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                btn.disabled = false;
                
                // Show a dummy toast/modal logic here ideally, or redirect
                alert('Pencarian untuk: ' + document.getElementById('nopol').value);
            }, 1500);
        }

        // Auto uppercase is handled by CSS visually, but let's enforce value on blur/input for consistency
        document.getElementById('nopol').addEventListener('input', function(e) {
            let start = this.selectionStart;
            let end = this.selectionEnd;
            this.value = this.value.toUpperCase();
            this.setSelectionRange(start, end);
        });
    </script>
