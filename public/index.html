<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CJM Motor - Sistem Informasi Service Bengkel</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <link rel="stylesheet" href="/assets/css/style.css"/>
    <link rel="stylesheet" href="/assets/css/mobile.css"/>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-center items-center p-4 font-sans antialiased">

    <!-- Container Utama Portal -->
    <main class="w-full max-w-md mx-auto flex flex-col items-center">
        <!-- Logo & Header -->
        <div class="text-center mb-8 flex flex-col items-center">
            <div class="w-20 h-20 bg-blue-600 rounded-full flex items-center justify-center mb-4 shadow-lg shadow-blue-600/30">
                <span class="material-symbols-outlined text-[44px]">two_wheeler</span>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-white">CJM MOTOR</h1>
            <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider font-semibold">Sistem Informasi Service Bengkel Motor</p>
        </div>

        <!-- Pilihan Akses Halaman (Pilih Role / Portal) -->
        <div class="w-full flex flex-col gap-4">
            <!-- Card 1: CS Search -->
            <a href="/cs/index.html" class="bg-slate-800 hover:bg-slate-750 border border-slate-700 hover:border-blue-500 rounded-2xl p-5 shadow-lg transition-all duration-200 flex items-center gap-4 group active:scale-[0.98]">
                <div class="w-12 h-12 bg-blue-500/20 text-blue-400 rounded-xl flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-colors">
                    <span class="material-symbols-outlined text-2xl">search</span>
                </div>
                <div class="flex-grow">
                    <div class="flex items-center justify-between">
                        <h2 class="font-bold text-white text-base group-hover:text-blue-400 transition-colors">Portal CS</h2>
                        <span class="material-symbols-outlined text-slate-500 text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
                    </div>
                    <p class="text-xs text-slate-400 mt-0.5">Cek riwayat service kendaraan berdasarkan nomor polisi</p>
                </div>
            </a>

            <!-- Card 2: Admin Login -->
            <a href="/admin/login.html" class="bg-slate-800 hover:bg-slate-750 border border-slate-700 hover:border-blue-500 rounded-2xl p-5 shadow-lg transition-all duration-200 flex items-center gap-4 group active:scale-[0.98]">
                <div class="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-xl flex items-center justify-center group-hover:bg-emerald-600 group-hover:text-white transition-colors">
                    <span class="material-symbols-outlined text-2xl">admin_panel_settings</span>
                </div>
                <div class="flex-grow">
                    <div class="flex items-center justify-between">
                        <h2 class="font-bold text-white text-base group-hover:text-emerald-400 transition-colors">Portal Admin</h2>
                        <span class="material-symbols-outlined text-slate-500 text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
                    </div>
                    <p class="text-xs text-slate-400 mt-0.5">Kelola data customer, kendaraan, & transaksi service</p>
                </div>
            </a>
        </div>

        <!-- Footer Info -->
        <footer class="mt-10 text-center text-[11px] text-slate-500">
            <p>&copy; 2026 CJM Motor. All rights reserved.</p>
        </footer>
    </main>

</body>
</html>
