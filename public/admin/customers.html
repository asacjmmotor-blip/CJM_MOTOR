<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Kelola Customer - CJM Motor Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <header class="fixed top-0 w-full z-40 bg-white border-b border-slate-200 h-16 flex items-center justify-between px-4">
        <div class="flex items-center gap-3">
            <a href="/admin/dashboard.html" class="p-2 text-slate-600 rounded-lg hover:bg-slate-100">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <h1 class="font-extrabold text-blue-950 text-lg">Kelola Customer</h1>
        </div>
        <button onclick="openModal()" class="h-9 px-3 bg-blue-900 text-white rounded-lg text-xs font-bold flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">add</span>
            <span>Tambah</span>
        </button>
    </header>

    <main class="pt-20 px-4 max-w-4xl mx-auto">
        <div class="mb-4">
            <input type="text" id="search-input" onkeyup="loadCustomers()" placeholder="Cari nama atau nomor HP..." class="w-full h-11 bg-white border border-slate-200 rounded-xl px-4 text-xs font-medium focus:border-blue-900 outline-none"/>
        </div>

        <div id="customer-list" class="flex flex-col gap-3">
            <!-- Dynamic customer items -->
        </div>
    </main>

    <!-- Modal Form Customer -->
    <div id="modal" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <h3 id="modal-title" class="font-bold text-lg text-slate-900 mb-4">Tambah Customer</h3>
            <form id="customer-form" onsubmit="event.preventDefault(); saveCustomer();" class="flex flex-col gap-4">
                <input type="hidden" id="cust-id"/>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">Nama Lengkap</label>
                    <input type="text" id="cust-name" required class="w-full h-11 border border-slate-200 rounded-xl px-3 text-xs outline-none focus:border-blue-900"/>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">Nomor HP</label>
                    <input type="text" id="cust-phone" required class="w-full h-11 border border-slate-200 rounded-xl px-3 text-xs outline-none focus:border-blue-900"/>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">Alamat</label>
                    <textarea id="cust-address" rows="3" class="w-full p-3 border border-slate-200 rounded-xl text-xs outline-none focus:border-blue-900"></textarea>
                </div>
                <div class="flex justify-end gap-2 mt-2">
                    <button type="button" onclick="closeModal()" class="h-10 px-4 text-xs font-bold text-slate-600 bg-slate-100 rounded-xl">Batal</button>
                    <button type="submit" class="h-10 px-5 text-xs font-bold text-white bg-blue-900 rounded-xl">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script>
        async function loadCustomers() {
            const q = document.getElementById('search-input').value.trim();
            try {
                const res = await apiRequest(`/customers/index.php?q=${encodeURIComponent(q)}`);
                if (res.success) {
                    const list = document.getElementById('customer-list');
                    if (res.data.length === 0) {
                        list.innerHTML = '<div class="p-6 bg-white rounded-xl text-center text-xs text-slate-500 border">Tidak ada customer ditemukan.</div>';
                        return;
                    }
                    list.innerHTML = res.data.map(c => `
                        <div class="bg-white p-4 rounded-xl border border-slate-200 flex items-center justify-between">
                            <div>
                                <h4 class="font-bold text-slate-900 text-sm">${c.name}</h4>
                                <p class="text-xs text-slate-500 mt-0.5">📞 ${c.phone} • ${c.address || '-'}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="editCustomer(${c.id}, '${escapeQuotes(c.name)}', '${escapeQuotes(c.phone)}', '${escapeQuotes(c.address)}')" class="p-2 text-blue-900 hover:bg-blue-50 rounded-lg"><span class="material-symbols-outlined text-sm">edit</span></button>
                                <button onclick="deleteCustomer(${c.id})" class="p-2 text-red-600 hover:bg-red-50 rounded-lg"><span class="material-symbols-outlined text-sm">delete</span></button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                if (err.message.includes('Akses ditolak')) window.location.href = '/admin/login.html';
            }
        }

        function escapeQuotes(str) {
            return (str || '').replace(/'/g, "\\'");
        }

        function openModal() {
            document.getElementById('modal-title').textContent = 'Tambah Customer';
            document.getElementById('cust-id').value = '';
            document.getElementById('cust-name').value = '';
            document.getElementById('cust-phone').value = '';
            document.getElementById('cust-address').value = '';
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function editCustomer(id, name, phone, address) {
            document.getElementById('modal-title').textContent = 'Edit Customer';
            document.getElementById('cust-id').value = id;
            document.getElementById('cust-name').value = name;
            document.getElementById('cust-phone').value = phone;
            document.getElementById('cust-address').value = address;
            document.getElementById('modal').classList.remove('hidden');
        }

        async function saveCustomer() {
            const id = document.getElementById('cust-id').value;
            const data = {
                name: document.getElementById('cust-name').value,
                phone: document.getElementById('cust-phone').value,
                address: document.getElementById('cust-address').value
            };

            try {
                if (id) {
                    await apiRequest(`/customers/detail.php?id=${id}`, 'PUT', data);
                } else {
                    await apiRequest('/customers/index.php', 'POST', data);
                }
                closeModal();
                loadCustomers();
            } catch (err) {
                alert(err.message);
            }
        }

        async function deleteCustomer(id) {
            if (!confirm('Apakah Anda yakin ingin menghapus customer ini?')) return;
            try {
                await apiRequest(`/customers/detail.php?id=${id}`, 'DELETE');
                loadCustomers();
            } catch (err) {
                alert(err.message);
            }
        }

        document.addEventListener('DOMContentLoaded', loadCustomers);
    </script>
</body>
</html>
