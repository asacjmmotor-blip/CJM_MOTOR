<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Kelola Service - CJM Motor Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <link rel="stylesheet" href="/assets/css/style.css"/>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <header class="fixed top-0 w-full z-40 bg-white border-b border-slate-200 h-16 flex items-center justify-between px-4">
        <div class="flex items-center gap-3">
            <a href="/admin/dashboard.html" class="p-2 text-slate-600 rounded-lg hover:bg-slate-100">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <h1 class="font-extrabold text-blue-950 text-lg">Daftar Service</h1>
        </div>
        <button onclick="openCreateModal()" class="h-9 px-3 bg-blue-900 text-white rounded-lg text-xs font-bold flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">add_circle</span>
            <span>Service Baru</span>
        </button>
    </header>

    <main class="pt-20 px-4 max-w-4xl mx-auto pb-10">
        <div class="flex gap-2 mb-4">
            <input type="text" id="search-input" onkeyup="loadServices()" placeholder="Cari kode service / plat / customer..." class="w-full h-11 bg-white border border-slate-200 rounded-xl px-4 text-xs font-medium focus:border-blue-900 outline-none"/>
            <select id="status-filter" onchange="loadServices()" class="h-11 border border-slate-200 rounded-xl px-3 text-xs bg-white focus:border-blue-900 outline-none">
                <option value="">Semua Status</option>
                <option value="Menunggu">Menunggu</option>
                <option value="Dikerjakan">Dikerjakan</option>
                <option value="Selesai">Selesai</option>
                <option value="Diambil">Diambil</option>
                <option value="Dibatalkan">Dibatalkan</option>
            </select>
        </div>

        <div id="service-list" class="flex flex-col gap-3">
            <!-- Dynamic services list -->
        </div>
    </main>

    <!-- Modal Form Service Baru (Stepper) -->
    <div id="modal-service" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4 border-b pb-3">
                <h3 class="font-bold text-lg text-slate-900">Tambah Service Baru</h3>
                <span id="step-indicator" class="text-xs font-bold bg-blue-50 text-blue-900 px-3 py-1 rounded-full">Step 1 dari 3</span>
            </div>

            <form id="service-form" onsubmit="event.preventDefault();">
                <!-- Step 1: Pilih Kendaraan -->
                <div id="step-1" class="flex flex-col gap-4">
                    <h4 class="text-xs font-bold text-slate-500 uppercase">Step 1: Pilih Kendaraan</h4>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Pilih Kendaraan Customer</label>
                        <select id="srv-vehicle" required class="w-full h-11 border border-slate-200 rounded-xl px-3 text-xs outline-none focus:border-blue-900">
                            <option value="">-- Pilih Kendaraan --</option>
                        </select>
                    </div>
                </div>

                <!-- Step 2: Rincian Service -->
                <div id="step-2" class="hidden flex-col gap-4">
                    <h4 class="text-xs font-bold text-slate-500 uppercase">Step 2: Rincian & Mekanik</h4>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Jenis Service</label>
                        <select id="srv-type" class="w-full h-11 border border-slate-200 rounded-xl px-3 text-xs outline-none focus:border-blue-900">
                            <option value="Service Ringan">Service Ringan</option>
                            <option value="Service Berat">Service Berat / Turun Mesin</option>
                            <option value="Service CVT">Service CVT</option>
                            <option value="Ganti Oli">Ganti Oli</option>
                            <option value="Pemeriksaan Rutin">Pemeriksaan Rutin</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Keluhan / Catatan Awal</label>
                        <textarea id="srv-complaint" rows="2" class="w-full p-3 border border-slate-200 rounded-xl text-xs outline-none focus:border-blue-900" placeholder="Keluhan pelanggan..."></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Mekanik Penanggung Jawab</label>
                            <input type="text" id="srv-mechanic" class="w-full h-11 border border-slate-200 rounded-xl px-3 text-xs outline-none focus:border-blue-900" placeholder="Nama mekanik"/>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Status Awal</label>
                            <select id="srv-status" class="w-full h-11 border border-slate-200 rounded-xl px-3 text-xs outline-none focus:border-blue-900">
                                <option value="Menunggu">Menunggu</option>
                                <option value="Dikerjakan">Dikerjakan</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Step 3: Item Sparepart / Pekerjaan -->
                <div id="step-3" class="hidden flex-col gap-4">
                    <h4 class="text-xs font-bold text-slate-500 uppercase">Step 3: Item Pekerjaan / Sparepart</h4>
                    <div id="items-container" class="flex flex-col gap-3">
                        <!-- Dynamic items -->
                    </div>
                    <button type="button" onclick="addItemRow()" class="h-9 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold flex items-center justify-center gap-1 self-start">
                        <span class="material-symbols-outlined text-sm">add</span>
                        <span>Tambah Item</span>
                    </button>
                </div>

                <div class="flex justify-between items-center mt-6 border-t pt-4">
                    <button type="button" id="btn-back" onclick="prevStep()" class="h-10 px-4 text-xs font-bold text-slate-600 bg-slate-100 rounded-xl hidden">Kembali</button>
                    <div class="flex-grow"></div>
                    <button type="button" id="btn-next" onclick="nextStep()" class="h-10 px-6 text-xs font-bold text-white bg-blue-900 rounded-xl">Lanjut</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script>
        let currentStep = 1;
        let vehiclesMap = [];

        async function loadVehiclesDropdown() {
            try {
                const res = await apiRequest('/vehicles/index.php');
                if (res.success) {
                    vehiclesMap = res.data;
                    const select = document.getElementById('srv-vehicle');
                    select.innerHTML = '<option value="">-- Pilih Kendaraan --</option>' + 
                        res.data.map(v => `<option value="${v.id}">${v.plate_number} - ${v.brand} ${v.model} (${v.customer_name})</option>`).join('');
                }
            } catch (err) {}
        }

        async function loadServices() {
            const q = document.getElementById('search-input').value.trim();
            const status = document.getElementById('status-filter').value;
            try {
                const res = await apiRequest(`/services/index.php?q=${encodeURIComponent(q)}&status=${encodeURIComponent(status)}`);
                if (res.success) {
                    const list = document.getElementById('service-list');
                    if (res.data.length === 0) {
                        list.innerHTML = '<div class="p-6 bg-white rounded-xl text-center text-xs text-slate-500 border">Tidak ada data service.</div>';
                        return;
                    }
                    list.innerHTML = res.data.map(s => {
                        let statusColor = 'bg-yellow-100 text-yellow-800';
                        if (s.status === 'Selesai' || s.status === 'Diambil') statusColor = 'bg-emerald-100 text-emerald-800';
                        if (s.status === 'Dikerjakan') statusColor = 'bg-blue-100 text-blue-800';
                        if (s.status === 'Dibatalkan') statusColor = 'bg-red-100 text-red-800';

                        return `
                            <div class="bg-white p-4 rounded-xl border border-slate-200 flex items-center justify-between hover:border-blue-300 transition-colors">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="font-extrabold text-blue-950 text-sm uppercase">${s.plate_number}</span>
                                        <span class="text-xs font-mono text-slate-400">${s.service_code}</span>
                                    </div>
                                    <p class="text-xs font-semibold text-slate-800 mt-1">${s.service_type} • ${s.brand} ${s.model}</p>
                                    <p class="text-[11px] text-slate-500 mt-0.5">${s.customer_name} • ${s.service_date} ${s.mechanic ? `• Mekanik: ${s.mechanic}` : ''}</p>
                                </div>
                                <div class="flex items-center gap-3">
                                    <span class="text-xs font-bold px-2.5 py-1 rounded-full ${statusColor}">${s.status}</span>
                                    <a href="/admin/service-detail.html?id=${s.id}" class="p-2 text-blue-900 hover:bg-blue-50 rounded-lg"><span class="material-symbols-outlined text-sm">visibility</span></a>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (err) {
                if (err.message.includes('Akses ditolak')) window.location.href = '/admin/login.html';
            }
        }

        function openCreateModal() {
            currentStep = 1;
            updateStepView();
            document.getElementById('items-container').innerHTML = '';
            addItemRow();
            document.getElementById('modal-service').classList.remove('hidden');
        }

        function closeCreateModal() {
            document.getElementById('modal-service').classList.add('hidden');
        }

        function updateStepView() {
            document.getElementById('step-1').classList.toggle('hidden', currentStep !== 1);
            document.getElementById('step-2').classList.toggle('hidden', currentStep !== 2);
            document.getElementById('step-3').classList.toggle('hidden', currentStep !== 3);
            document.getElementById('step-indicator').textContent = `Step ${currentStep} dari 3`;

            const btnBack = document.getElementById('btn-back');
            const btnNext = document.getElementById('btn-next');

            btnBack.classList.toggle('hidden', currentStep === 1);
            btnNext.textContent = currentStep === 3 ? 'Simpan Service' : 'Lanjut';
        }

        function nextStep() {
            if (currentStep === 1) {
                if (!document.getElementById('srv-vehicle').value) {
                    alert('Silakan pilih kendaraan terlebih dahulu.');
                    return;
                }
                currentStep = 2;
            } else if (currentStep === 2) {
                currentStep = 3;
            } else if (currentStep === 3) {
                saveService();
                return;
            }
            updateStepView();
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                updateStepView();
            }
        }

        function addItemRow() {
            const container = document.getElementById('items-container');
            const row = document.createElement('div');
            row.className = 'item-row grid grid-cols-12 gap-2 items-center bg-slate-50 p-2.5 rounded-xl border border-slate-100';
            row.innerHTML = `
                <div class="col-span-5"><input type="text" placeholder="Nama Sparepart/Jasa" class="item-name w-full h-9 border border-slate-200 rounded-lg text-xs px-2 outline-none"/></div>
                <div class="col-span-3">
                    <select class="item-type w-full h-9 border border-slate-200 rounded-lg text-xs px-1 outline-none">
                        <option value="Jasa">Jasa</option>
                        <option value="Sparepart">Sparepart</option>
                        <option value="Oli">Oli</option>
                    </select>
                </div>
                <div class="col-span-2"><input type="number" value="1" placeholder="Qty" class="item-qty w-full h-9 border border-slate-200 rounded-lg text-xs px-2 outline-none"/></div>
                <div class="col-span-2 flex justify-end"><button type="button" onclick="this.closest('.item-row').remove()" class="text-red-500 hover:text-red-700"><span class="material-symbols-outlined text-sm">delete</span></button></div>
            `;
            container.appendChild(row);
        }

        async function saveService() {
            const vehicleId = document.getElementById('srv-vehicle').value;
            const serviceType = document.getElementById('srv-type').value;
            const complaint = document.getElementById('srv-complaint').value;
            const mechanic = document.getElementById('srv-mechanic').value;
            const status = document.getElementById('srv-status').value;

            const itemRows = document.querySelectorAll('.item-row');
            const items = [];
            itemRows.forEach(row => {
                const name = row.querySelector('.item-name').value.trim();
                const type = row.querySelector('.item-type').value;
                const qty = parseInt(row.querySelector('.item-qty').value) || 1;
                if (name) {
                    items.push({ item_name: name, item_type: type, quantity: qty, price: 0 });
                }
            });

            try {
                await apiRequest('/services/create.php', 'POST', {
                    vehicle_id: vehicleId,
                    service_type: serviceType,
                    complaint: complaint,
                    mechanic: mechanic,
                    status: status,
                    items: items
                });
                closeCreateModal();
                loadServices();
            } catch (err) {
                alert(err.message);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadVehiclesDropdown();
            loadServices();
        });
    </script>
</body>
</html>
