<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Profil & Ubah Password Admin - CJM Motor</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <!-- Top AppBar -->
    <header class="fixed top-0 w-full z-40 bg-white border-b border-slate-200 h-16 flex items-center justify-between px-4">
        <div class="flex items-center gap-3">
            <button id="menuToggle" class="p-2 text-slate-600 rounded-lg hover:bg-slate-100">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <h1 class="font-extrabold text-blue-950 text-lg">Profil & Keamanan Admin</h1>
        </div>
        <button onclick="logout()" class="text-xs text-red-600 font-bold hover:underline p-2 flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">logout</span>
            <span>Logout</span>
        </button>
    </header>

    <!-- Sidebar / Offcanvas Drawer -->
    <div id="drawerOverlay" class="fixed inset-0 bg-slate-900/50 z-50 hidden"></div>
    <nav id="navigationDrawer" class="fixed inset-y-0 left-0 z-50 bg-white shadow-xl h-full w-[280px] -translate-x-full transition-transform duration-300 flex flex-col py-6 px-4">
        <div class="mb-6 flex items-center gap-3 px-2">
            <div class="w-10 h-10 rounded-full bg-blue-900 text-white flex items-center justify-center font-bold">A</div>
            <div>
                <h2 id="drawer-admin-name" class="font-bold text-slate-900 text-sm">Admin Bengkel</h2>
                <p class="text-xs text-slate-500">System Operator</p>
            </div>
        </div>

        <ul class="flex flex-col gap-1">
            <li><a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-100 font-semibold rounded-xl text-sm"><span class="material-symbols-outlined">dashboard</span>Dashboard</a></li>
            <li><a href="vehicles.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-100 font-semibold rounded-xl text-sm"><span class="material-symbols-outlined">two_wheeler</span>Kendaraan</a></li>
            <li><a href="services.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-100 font-semibold rounded-xl text-sm"><span class="material-symbols-outlined">build</span>Service</a></li>
            <li><a href="reports.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-100 font-semibold rounded-xl text-sm"><span class="material-symbols-outlined">assessment</span>Laporan</a></li>
            <li><a href="profile.html" class="flex items-center gap-3 px-4 py-3 bg-blue-50 text-blue-900 font-bold rounded-xl text-sm"><span class="material-symbols-outlined">account_circle</span>Profil Admin</a></li>
            <li class="mt-4 border-t pt-4"><button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 font-bold rounded-xl text-sm"><span class="material-symbols-outlined">logout</span>Logout</button></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="pt-20 px-4 max-w-xl mx-auto md:ml-[280px] md:pt-24 pb-10">
        
        <!-- Admin Profile Info Card -->
        <div class="bg-blue-950 text-white rounded-2xl p-6 shadow-sm mb-6 flex items-center gap-4">
            <div class="w-14 h-14 rounded-full bg-blue-600 text-white flex items-center justify-center font-extrabold text-2xl shadow-inner">
                <span class="material-symbols-outlined text-3xl">manage_accounts</span>
            </div>
            <div>
                <h2 id="prof-name" class="text-lg font-bold">Admin Bengkel</h2>
                <p id="prof-username" class="text-xs text-blue-200 mt-0.5">Username: admin</p>
                <span class="inline-block mt-2 px-2.5 py-0.5 bg-blue-800 text-blue-100 text-[10px] font-bold rounded-full uppercase">System Administrator</span>
            </div>
        </div>

        <!-- Form Ubah Password Card -->
        <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
            <div class="flex items-center gap-2 mb-4 border-b pb-3">
                <span class="material-symbols-outlined text-blue-900 font-bold">lock_reset</span>
                <h3 class="font-bold text-slate-900 text-base">Ubah Password Admin</h3>
            </div>

            <div id="notify-msg" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold"></div>

            <form id="form-change-password" onsubmit="event.preventDefault(); handlePasswordChange();" class="flex flex-col gap-4">
                <div>
                    <label for="curr-pass" class="block text-xs font-bold text-slate-700 mb-1">Password Saat Ini <span class="text-red-500">*</span></label>
                    <input type="password" id="curr-pass" required class="w-full h-11 border border-slate-300 rounded-xl px-3 text-xs outline-none focus:border-blue-900" placeholder="Masukkan password lama"/>
                </div>

                <div>
                    <label for="new-pass" class="block text-xs font-bold text-slate-700 mb-1">Password Baru <span class="text-red-500">*</span></label>
                    <input type="password" id="new-pass" required minlength="6" class="w-full h-11 border border-slate-300 rounded-xl px-3 text-xs outline-none focus:border-blue-900" placeholder="Minimal 6 karakter"/>
                </div>

                <div>
                    <label for="conf-pass" class="block text-xs font-bold text-slate-700 mb-1">Konfirmasi Password Baru <span class="text-red-500">*</span></label>
                    <input type="password" id="conf-pass" required minlength="6" class="w-full h-11 border border-slate-300 rounded-xl px-3 text-xs outline-none focus:border-blue-900" placeholder="Ketik ulang password baru"/>
                </div>

                <div class="flex justify-end gap-2 mt-2">
                    <button type="submit" id="btn-save-pass" class="h-11 px-6 text-xs font-bold text-white bg-blue-900 hover:bg-blue-800 rounded-xl transition-colors active:scale-[0.98]">
                        Simpan Password Baru
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navigationDrawer = document.getElementById('navigationDrawer');
        const drawerOverlay = document.getElementById('drawerOverlay');

        menuToggle.addEventListener('click', () => {
            navigationDrawer.classList.remove('-translate-x-full');
            drawerOverlay.classList.remove('hidden');
        });

        drawerOverlay.addEventListener('click', () => {
            navigationDrawer.classList.add('-translate-x-full');
            drawerOverlay.classList.add('hidden');
        });

        async function loadProfile() {
            try {
                const res = await apiRequest('/auth/profile.php');
                if (res.success && res.data) {
                    document.getElementById('prof-name').textContent = res.data.name || 'Admin Bengkel';
                    document.getElementById('prof-username').textContent = `Username: ${res.data.username}`;
                    document.getElementById('drawer-admin-name').textContent = res.data.name || 'Admin Bengkel';
                }
            } catch (err) {
                if (err.message.includes('Akses ditolak') || err.message.includes('Sesi')) {
                    window.location.href = 'login.html';
                }
            }
        }

        async function handlePasswordChange() {
            const currPass = document.getElementById('curr-pass').value.trim();
            const newPass = document.getElementById('new-pass').value.trim();
            const confPass = document.getElementById('conf-pass').value.trim();
            const notify = document.getElementById('notify-msg');
            const btn = document.getElementById('btn-save-pass');

            notify.classList.add('hidden');

            if (newPass !== confPass) {
                notify.className = 'mb-4 p-3 rounded-xl text-xs font-semibold bg-red-50 text-red-700 border border-red-200';
                notify.textContent = 'Konfirmasi password baru tidak cocok.';
                notify.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Memproses...';

            try {
                const res = await apiRequest('/auth/profile.php', 'POST', {
                    action: 'change_password',
                    current_password: currPass,
                    new_password: newPass,
                    confirm_password: confPass
                });

                notify.className = 'mb-4 p-3 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200';
                notify.textContent = res.message || 'Password berhasil diubah!';
                notify.classList.remove('hidden');

                document.getElementById('form-change-password').reset();
            } catch (err) {
                notify.className = 'mb-4 p-3 rounded-xl text-xs font-semibold bg-red-50 text-red-700 border border-red-200';
                notify.textContent = err.message || 'Gagal mengubah password.';
                notify.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Simpan Password Baru';
            }
        }

        async function logout() {
            try {
                await apiRequest('/auth/logout.php', 'POST');
            } finally {
                window.location.href = 'login.html';
            }
        }

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
