<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Login Admin - CJM Motor</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4 font-sans antialiased">
    <div class="bg-white border border-slate-200 rounded-3xl p-6 md:p-8 w-full max-w-md shadow-xl">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-900 text-white rounded-full flex items-center justify-center mx-auto mb-3 shadow-md">
                <span class="material-symbols-outlined text-3xl">admin_panel_settings</span>
            </div>
            <h1 class="text-2xl font-extrabold text-blue-950">Login Admin</h1>
            <p class="text-xs text-slate-500 font-semibold mt-1 uppercase tracking-wider">Service CJM Motor</p>
        </div>

        <div id="error-box" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl text-center font-medium"></div>

        <form id="login-form" onsubmit="event.preventDefault(); handleLogin();" class="flex flex-col gap-4">
            <div>
                <label for="username" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Username</label>
                <input type="text" id="username" required class="w-full h-12 bg-slate-50 border border-slate-300 rounded-xl px-4 text-sm text-slate-900 focus:border-blue-900 focus:ring-1 focus:ring-blue-900 outline-none transition-colors" placeholder="Masukkan username admin"/>
            </div>
            <div>
                <label for="password" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Password</label>
                <input type="password" id="password" required class="w-full h-12 bg-slate-50 border border-slate-300 rounded-xl px-4 text-sm text-slate-900 focus:border-blue-900 focus:ring-1 focus:ring-blue-900 outline-none transition-colors" placeholder="••••••••"/>
            </div>
            <button type="submit" id="btn-login" class="h-12 bg-blue-900 hover:bg-blue-800 text-white font-bold rounded-xl text-sm transition-colors mt-2 active:scale-[0.98]">
                MASUK KE DASHBOARD
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="../cs/index.html" class="text-xs text-slate-500 hover:text-blue-900 font-bold transition-colors">← Kembali ke Halaman CS</a>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script>
        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('error-box');
            const btn = document.getElementById('btn-login');

            errorBox.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Memproses...';

            try {
                const res = await apiRequest('/auth/login', 'POST', { username, password });
                if (res.success) {
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                errorBox.textContent = err.message || 'Login gagal.';
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'MASUK KE DASHBOARD';
            }
        }
    </script>
</body>
</html>
