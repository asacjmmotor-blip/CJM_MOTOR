<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Detail Service - CJM Motor Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">
    <header class="fixed top-0 w-full z-40 bg-white border-b border-slate-200 h-16 flex items-center justify-between px-4 max-w-lg mx-auto left-0 right-0">
        <a href="services.html" class="p-2 text-slate-700 hover:text-blue-900 rounded-lg flex items-center gap-1">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <h1 class="font-extrabold text-blue-950 text-base">Detail Service</h1>
        <button onclick="deleteCurrentService()" class="p-2 text-red-600 hover:bg-red-50 rounded-lg" title="Hapus Data">
            <span class="material-symbols-outlined text-lg">delete</span>
        </button>
    </header>

    <main class="pt-20 px-4 max-w-lg mx-auto w-full pb-24 flex flex-col gap-4 flex-grow" id="main-content">
        <div class="bg-white rounded-2xl p-8 border border-slate-200 text-center text-slate-500">
            <span class="material-symbols-outlined text-4xl text-blue-900 animate-spin mb-2">progress_activity</span>
            <p class="font-semibold text-sm">Memuat Rincian Service...</p>
        </div>
    </main>

    <!-- Fixed Bottom Action Bar (Ubah, Batalkan, Selesai) -->
    <div id="action-bar" class="fixed bottom-0 left-0 right-0 max-w-lg mx-auto bg-white border-t border-slate-200 p-4 z-30 flex items-center gap-2 hidden">
        <button onclick="openEditModal()" class="flex-1 h-12 border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold rounded-2xl text-xs transition-colors active:scale-[0.98]">
            Ubah
        </button>
        <button onclick="changeStatus('Dibatalkan')" class="flex-1 h-12 bg-red-600 hover:bg-red-700 text-white font-bold rounded-2xl text-xs transition-colors active:scale-[0.98]">
            Batalkan
        </button>
        <button id="btn-main-action" onclick="changeStatus('Selesai')" class="flex-1 h-12 bg-blue-900 hover:bg-blue-800 text-white font-bold rounded-2xl text-xs transition-colors active:scale-[0.98]">
            Selesai
        </button>
    </div>

    <!-- Modal Edit Status & Mechanic -->
    <div id="modal-edit" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl">
            <div class="flex items-center justify-between mb-4 border-b pb-3">
                <h3 class="font-bold text-base text-blue-950">Ubah Status & Mekanik</h3>
                <button type="button" onclick="closeEditModal()" class="text-slate-400"><span class="material-symbols-outlined text-xl">close</span></button>
            </div>
            <div class="flex flex-col gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Status Service</label>
                    <select id="edit-status" class="w-full h-11 border border-slate-300 rounded-xl px-3 text-xs font-bold bg-slate-50 outline-none">
                        <option value="Menunggu">Menunggu</option>
                        <option value="Proses">Proses</option>
                        <option value="Selesai">Selesai</option>
                        <option value="Diambil">Diambil</option>
                        <option value="Dibatalkan">Dibatalkan</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Mekanik Penanggung Jawab</label>
                    <input type="text" id="edit-mechanic" class="w-full h-11 border border-slate-300 rounded-xl px-3.5 text-xs outline-none bg-slate-50"/>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Catatan Service</label>
                    <textarea id="edit-notes" rows="2" class="w-full p-3 border border-slate-300 rounded-xl text-xs outline-none bg-slate-50"></textarea>
                </div>
                <div class="flex justify-end gap-2 mt-2">
                    <button type="button" onclick="saveEdit()" class="h-11 px-6 bg-blue-900 hover:bg-blue-800 text-white text-xs font-bold rounded-xl">Simpan Perubahan</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const serviceId = urlParams.get('id');
        let currentServiceData = null;

        async function loadServiceDetail() {
            if (!serviceId) {
                window.location.href = 'services.html';
                return;
            }

            try {
                const res = await apiRequest(`/services/detail?id=${serviceId}`);
                if (res.success && res.data) {
                    const s = res.data;
                    currentServiceData = s;
                    
                    let statusColor = 'bg-amber-100 text-amber-800 border-amber-200';
                    if (s.status === 'Selesai' || s.status === 'Diambil') statusColor = 'bg-emerald-100 text-emerald-800 border-emerald-200';
                    if (s.status === 'Proses') statusColor = 'bg-blue-100 text-blue-800 border-blue-200';
                    if (s.status === 'Dibatalkan') statusColor = 'bg-red-100 text-red-800 border-red-200';

                    const dateStr = s.service_date ? new Date(s.service_date).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
                    const formattedCost = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(s.total_cost || 0);

                    document.getElementById('main-content').innerHTML = `
                        <!-- Blue Header Card -->
                        <div class="bg-blue-900 text-white rounded-3xl p-5 shadow-sm flex flex-col gap-3">
                            <div class="flex items-start justify-between">
                                <div>
                                    <div class="flex items-center gap-1.5">
                                        <span class="text-sm font-extrabold tracking-wider text-blue-100">${s.service_code}</span>
                                        <span class="material-symbols-outlined text-xs text-blue-300 cursor-pointer" onclick="navigator.clipboard.writeText('${s.service_code}')">content_copy</span>
                                    </div>
                                    <h2 class="text-xl font-extrabold tracking-widest uppercase mt-1">${s.plate_number}</h2>
                                    <p class="text-xs font-semibold text-blue-100 mt-0.5">${s.brand} ${s.model}</p>
                                    <p class="text-xs text-blue-200 mt-0.5">${s.customer_name || 'Umum'}</p>
                                </div>
                                <div class="flex flex-col items-end gap-1">
                                    <span class="text-xs font-bold px-3 py-1 rounded-full bg-amber-100 text-amber-900 border border-amber-200 shadow-sm">${s.status}</span>
                                    <span class="text-[11px] text-blue-200 flex items-center gap-1 mt-2">
                                        <span class="material-symbols-outlined text-xs">calendar_today</span>
                                        ${dateStr}
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- Informasi Service Card -->
                        <div class="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm flex flex-col gap-3">
                            <h3 class="text-xs font-extrabold text-slate-900 uppercase tracking-wider">Informasi Service</h3>
                            
                            <div class="grid grid-cols-12 gap-2 text-xs">
                                <span class="col-span-4 text-slate-400 font-semibold">Keluhan</span>
                                <span class="col-span-8 font-bold text-slate-800">${s.complaint || '-'}</span>
                            </div>

                            <div class="grid grid-cols-12 gap-2 text-xs">
                                <span class="col-span-4 text-slate-400 font-semibold">Jenis Service</span>
                                <span class="col-span-8 font-bold text-slate-800">${s.service_type}</span>
                            </div>

                            <div class="grid grid-cols-12 gap-2 text-xs">
                                <span class="col-span-4 text-slate-400 font-semibold">Mekanik</span>
                                <span class="col-span-8 font-bold text-slate-800">${s.mechanic || '-'}</span>
                            </div>

                            <div class="grid grid-cols-12 gap-2 text-xs">
                                <span class="col-span-4 text-slate-400 font-semibold">Catatan</span>
                                <span class="col-span-8 font-semibold text-slate-600">${s.notes || '-'}</span>
                            </div>
                        </div>

                        <!-- Item Pekerjaan Card -->
                        <div class="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm flex flex-col gap-3">
                            <h3 class="text-xs font-extrabold text-slate-900 uppercase tracking-wider">Item Pekerjaan</h3>
                            <div class="flex flex-col gap-2">
                                ${(s.items && s.items.length > 0) ? s.items.map(item => `
                                    <div class="flex items-center justify-between text-xs py-1.5 border-b border-slate-50 last:border-0">
                                        <span class="font-bold text-slate-800">• ${item.item_name}</span>
                                        <span class="font-bold text-slate-900">${new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(item.subtotal || 0)}</span>
                                    </div>
                                `).join('') : '<p class="text-xs text-slate-400 font-medium">Belum ada item ditambahkan.</p>'}
                            </div>
                        </div>

                        <!-- Total Biaya Blue Container -->
                        <div class="bg-blue-50 border border-blue-100 rounded-3xl p-4 flex items-center justify-between">
                            <span class="text-xs font-bold text-blue-900 uppercase tracking-wider">Total Biaya</span>
                            <span class="text-lg font-extrabold text-blue-900">${formattedCost}</span>
                        </div>
                    `;

                    document.getElementById('action-bar').classList.remove('hidden');

                    const btnMain = document.getElementById('btn-main-action');
                    if (s.status === 'Menunggu') {
                        btnMain.textContent = 'Proses';
                        btnMain.onclick = () => changeStatus('Proses');
                    } else if (s.status === 'Proses') {
                        btnMain.textContent = 'Selesai';
                        btnMain.onclick = () => changeStatus('Selesai');
                    } else if (s.status === 'Selesai') {
                        btnMain.textContent = 'Diambil';
                        btnMain.onclick = () => changeStatus('Diambil');
                    } else {
                        btnMain.textContent = 'Selesai';
                        btnMain.onclick = () => changeStatus('Selesai');
                    }
                }
            } catch (err) {
                if (err.message.includes('Akses ditolak')) window.location.href = 'login.html';
            }
        }

        function openEditModal() {
            if (!currentServiceData) return;
            document.getElementById('edit-status').value = currentServiceData.status;
            document.getElementById('edit-mechanic').value = currentServiceData.mechanic || '';
            document.getElementById('edit-notes').value = currentServiceData.notes || '';
            document.getElementById('modal-edit').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('modal-edit').classList.add('hidden');
        }

        async function saveEdit() {
            const status = document.getElementById('edit-status').value;
            const mechanic = document.getElementById('edit-mechanic').value.trim();
            const notes = document.getElementById('edit-notes').value.trim();

            try {
                await apiRequest('/services/update', 'PUT', {
                    id: serviceId,
                    status,
                    mechanic,
                    notes
                });
                closeEditModal();
                loadServiceDetail();
            } catch (err) {
                alert(err.message);
            }
        }

        async function changeStatus(newStatus) {
            try {
                await apiRequest('/services/update', 'PUT', {
                    id: serviceId,
                    status: newStatus
                });
                loadServiceDetail();
            } catch (err) {
                alert(err.message);
            }
        }

        async function deleteCurrentService() {
            if (!confirm('Apakah Anda yakin ingin menghapus data service ini?')) return;
            try {
                await apiRequest(`/services/detail?id=${serviceId}`, 'DELETE');
                window.location.href = 'services.html';
            } catch (err) {
                alert(err.message);
            }
        }

        document.addEventListener('DOMContentLoaded', loadServiceDetail);
    </script>
</body>
</html>
