<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Kelola Kendaraan - CJM Motor Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <!-- Top AppBar -->
    <header class="fixed top-0 w-full z-40 bg-white border-b border-slate-200 h-16 flex items-center justify-between px-4">
        <div class="flex items-center gap-3">
            <button id="menuToggle" class="p-2 text-slate-600 rounded-lg hover:bg-slate-100">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <h1 class="font-extrabold text-blue-950 text-lg">Kelola Kendaraan</h1>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="openModal()" class="h-9 px-3 bg-blue-900 text-white rounded-lg text-xs font-bold flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">add</span>
                <span>Tambah</span>
            </button>
            <button onclick="logout()" class="text-xs text-red-600 font-bold hover:underline p-2 flex items-center gap-1">
                <span class="material-symbols-outlined text-sm">logout</span>
            </button>
        </div>
    </header>

    <!-- Sidebar / Offcanvas Drawer -->
    <div id="drawerOverlay" class="fixed inset-0 bg-slate-900/50 z-50 hidden"></div>
    <nav id="navigationDrawer" class="fixed inset-y-0 left-0 z-50 bg-white shadow-xl h-full w-[280px] -translate-x-full transition-transform duration-300 flex flex-col py-6 px-4">
        <div class="mb-6 flex items-center gap-3 px-2">
            <div class="w-10 h-10 rounded-full bg-blue-900 text-white flex items-center justify-center font-bold">A</div>
            <div>
                <h2 class="font-bold text-slate-900 text-sm">Admin Bengkel</h2>
                <p class="text-xs text-slate-500">System Operator</p>
            </div>
        </div>

        <ul class="flex flex-col gap-1">
            <li><a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-100 font-semibold rounded-xl text-sm"><span class="material-symbols-outlined">dashboard</span>Dashboard</a></li>
            <li><a href="customers.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-100 font-semibold rounded-xl text-sm"><span class="material-symbols-outlined">person</span>Customer</a></li>
            <li><a href="vehicles.html" class="flex items-center gap-3 px-4 py-3 bg-blue-50 text-blue-900 font-bold rounded-xl text-sm"><span class="material-symbols-outlined">two_wheeler</span>Kendaraan</a></li>
            <li><a href="services.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-100 font-semibold rounded-xl text-sm"><span class="material-symbols-outlined">build</span>Service</a></li>
            <li><a href="reports.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-100 font-semibold rounded-xl text-sm"><span class="material-symbols-outlined">assessment</span>Laporan</a></li>
            <li class="mt-4 border-t pt-4"><button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 font-bold rounded-xl text-sm"><span class="material-symbols-outlined">logout</span>Logout</button></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="pt-20 px-4 max-w-4xl mx-auto md:ml-[280px] md:pt-24">
        <div class="mb-4">
            <input type="text" id="search-input" onkeyup="loadVehicles()" placeholder="Cari nomor polisi / merek / pemilik..." class="w-full h-11 bg-white border border-slate-200 rounded-xl px-4 text-xs font-medium focus:border-blue-900 outline-none"/>
        </div>

        <div id="vehicle-list" class="flex flex-col gap-3">
            <!-- Dynamic vehicle items -->
        </div>
    </main>

    <!-- Modal Form Kendaraan -->
    <div id="modal" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <h3 id="modal-title" class="font-bold text-lg text-slate-900 mb-4">Tambah Kendaraan</h3>
            <form id="vehicle-form" onsubmit="event.preventDefault(); saveVehicle();" class="flex flex-col gap-4">
                <input type="hidden" id="veh-id"/>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">Pemilik (Customer)</label>
                    <select id="veh-customer" required class="w-full h-11 border border-slate-200 rounded-xl px-3 text-xs outline-none focus:border-blue-900">
                        <option value="">-- Pilih Customer --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">Nomor Polisi</label>
                    <input type="text" id="veh-plate" required class="nopol-input w-full h-11 border border-slate-200 rounded-xl px-3 text-xs font-bold uppercase outline-none focus:border-blue-900" placeholder="B 1234 ABC"/>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Merek</label>
                        <input type="text" id="veh-brand" required class="w-full h-11 border border-slate-200 rounded-xl px-3 text-xs outline-none focus:border-blue-900" placeholder="Honda / Yamaha / Suzuki"/>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Model / Tipe</label>
                        <input type="text" id="veh-model" required class="w-full h-11 border border-slate-200 rounded-xl px-3 text-xs outline-none focus:border-blue-900" placeholder="Beat / NMAX / GSX"/>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Tahun</label>
                        <input type="number" id="veh-year" class="w-full h-11 border border-slate-200 rounded-xl px-3 text-xs outline-none focus:border-blue-900" placeholder="2024"/>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Warna</label>
                        <input type="text" id="veh-color" class="w-full h-11 border border-slate-200 rounded-xl px-3 text-xs outline-none focus:border-blue-900" placeholder="Hitam / Merah"/>
                    </div>
                </div>
                <div class="flex justify-end gap-2 mt-2">
                    <button type="button" onclick="closeModal()" class="h-10 px-4 text-xs font-bold text-slate-600 bg-slate-100 rounded-xl">Batal</button>
                    <button type="submit" class="h-10 px-5 text-xs font-bold text-white bg-blue-900 rounded-xl">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/cs.js"></script>
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navigationDrawer = document.getElementById('navigationDrawer');
        const drawerOverlay = document.getElementById('drawerOverlay');

        menuToggle.addEventListener('click', () => {
            navigationDrawer.classList.remove('-translate-x-full');
            drawerOverlay.classList.remove('hidden');
        });

        drawerOverlay.addEventListener('click', () => {
            navigationDrawer.classList.add('-translate-x-full');
            drawerOverlay.classList.add('hidden');
        });

        formatPlateInput(document.getElementById('veh-plate'));
        let customersMap = [];

        async function loadCustomersDropdown() {
            try {
                const res = await apiRequest('/customers/index.php');
                if (res.success) {
                    customersMap = res.data;
                    const select = document.getElementById('veh-customer');
                    select.innerHTML = '<option value="">-- Pilih Customer --</option>' + 
                        res.data.map(c => `<option value="${c.id}">${c.name} (${c.phone})</option>`).join('');
                }
            } catch (err) {}
        }

        async function loadVehicles() {
            const q = document.getElementById('search-input').value.trim();
            try {
                const res = await apiRequest(`/vehicles/index.php?q=${encodeURIComponent(q)}`);
                if (res.success) {
                    const list = document.getElementById('vehicle-list');
                    if (res.data.length === 0) {
                        list.innerHTML = '<div class="p-6 bg-white rounded-xl text-center text-xs text-slate-500 border">Tidak ada kendaraan ditemukan.</div>';
                        return;
                    }
                    list.innerHTML = res.data.map(v => `
                        <div class="bg-white p-4 rounded-xl border border-slate-200 flex items-center justify-between">
                            <div>
                                <span class="font-extrabold text-blue-950 text-base uppercase">${v.plate_number}</span>
                                <p class="text-xs font-semibold text-slate-700 mt-0.5">${v.brand} ${v.model} ${v.year ? `(${v.year})` : ''} • Warna: ${v.color || '-'}</p>
                                <p class="text-[11px] text-slate-500 mt-0.5">Pemilik: ${v.customer_name || '-'}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="editVehicle(${v.id}, ${v.customer_id}, '${v.plate_number}', '${v.brand}', '${v.model}', '${v.year || ''}', '${v.color || ''}')" class="p-2 text-blue-900 hover:bg-blue-50 rounded-lg"><span class="material-symbols-outlined text-sm">edit</span></button>
                                <button onclick="deleteVehicle(${v.id})" class="p-2 text-red-600 hover:bg-red-50 rounded-lg"><span class="material-symbols-outlined text-sm">delete</span></button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                if (err.message.includes('Akses ditolak')) window.location.href = 'login.html';
            }
        }

        function openModal() {
            document.getElementById('modal-title').textContent = 'Tambah Kendaraan';
            document.getElementById('veh-id').value = '';
            document.getElementById('veh-customer').value = '';
            document.getElementById('veh-plate').value = '';
            document.getElementById('veh-brand').value = '';
            document.getElementById('veh-model').value = '';
            document.getElementById('veh-year').value = '';
            document.getElementById('veh-color').value = '';
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function editVehicle(id, custId, plate, brand, model, year, color) {
            document.getElementById('modal-title').textContent = 'Edit Kendaraan';
            document.getElementById('veh-id').value = id;
            document.getElementById('veh-customer').value = custId;
            document.getElementById('veh-plate').value = plate;
            document.getElementById('veh-brand').value = brand;
            document.getElementById('veh-model').value = model;
            document.getElementById('veh-year').value = year;
            document.getElementById('veh-color').value = color;
            document.getElementById('modal').classList.remove('hidden');
        }

        async function saveVehicle() {
            const id = document.getElementById('veh-id').value;
            const data = {
                customer_id: document.getElementById('veh-customer').value,
                plate_number: document.getElementById('veh-plate').value,
                brand: document.getElementById('veh-brand').value,
                model: document.getElementById('veh-model').value,
                year: document.getElementById('veh-year').value,
                color: document.getElementById('veh-color').value
            };

            try {
                if (id) {
                    await apiRequest(`/vehicles/detail.php?id=${id}`, 'PUT', data);
                } else {
                    await apiRequest('/vehicles/index.php', 'POST', data);
                }
                closeModal();
                loadVehicles();
            } catch (err) {
                alert(err.message);
            }
        }

        async function deleteVehicle(id) {
            if (!confirm('Apakah Anda yakin ingin menghapus kendaraan ini?')) return;
            try {
                await apiRequest(`/vehicles/detail.php?id=${id}`, 'DELETE');
                loadVehicles();
            } catch (err) {
                alert(err.message);
            }
        }

        async function logout() {
            try {
                await apiRequest('/auth/logout.php', 'POST');
            } finally {
                window.location.href = 'login.html';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadCustomersDropdown();
            loadVehicles();
        });
    </script>
</body>
</html>
