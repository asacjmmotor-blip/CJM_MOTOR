<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Hasil Riwayat Service - CJM Motor</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 h-16 flex items-center justify-between max-w-lg mx-auto w-full">
        <a href="index.html" class="flex items-center gap-2 text-slate-700 hover:text-blue-900 font-semibold text-sm">
            <span class="material-symbols-outlined">arrow_back</span>
            <span>Cari Kembali</span>
        </a>
        <h1 class="font-bold text-blue-950 text-base">Riwayat Service Motor</h1>
        <div class="w-6"></div>
    </header>

    <main class="flex-grow p-4 w-full max-w-lg mx-auto flex flex-col gap-4" id="main-container">
        <div class="bg-white rounded-2xl p-8 border border-slate-200 text-center text-slate-500">
            <span class="material-symbols-outlined text-4xl text-blue-900 animate-spin mb-2">progress_activity</span>
            <p class="font-semibold text-sm">Mengambil Data Realtime Database...</p>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const qParam = urlParams.get('q') || urlParams.get('nopol') || urlParams.get('plate');
            const idParam = urlParams.get('id');
            const mainContainer = document.getElementById('main-container');

            let item = null;

            // 1. Direct Live API Fetch from Supabase database if query parameter exists
            if (qParam || idParam) {
                try {
                    const endpoint = idParam ? `/vehicles/detail?id=${idParam}` : `/vehicles/search?q=${encodeURIComponent(qParam)}`;
                    const res = await apiRequest(endpoint);
                    if (res.success && res.data) {
                        item = Array.isArray(res.data) ? res.data[0] : res.data;
                    }
                } catch (err) {
                    console.warn('Live API fetch error, fallbacking to session:', err);
                }
            }

            // 2. Fallback to Session Storage if URL search parameter was missing
            if (!item) {
                const dataRaw = sessionStorage.getItem('cs_search_result');
                if (dataRaw) {
                    try { item = JSON.parse(dataRaw); } catch(e) {}
                }
            }

            if (!item) {
                window.location.href = 'index.html';
                return;
            }

            const veh = item.vehicle || item;
            const services = item.services || [];

            mainContainer.innerHTML = `
                <!-- Vehicle Info Card -->
                <div class="bg-blue-950 text-white rounded-2xl p-5 shadow-sm">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xl font-extrabold tracking-widest uppercase">${veh.plate_number || item.plate_number}</span>
                        <span class="material-symbols-outlined text-blue-200 text-2xl">two_wheeler</span>
                    </div>
                    <p class="text-sm font-semibold text-blue-100">${veh.brand || item.brand} ${veh.model || item.model} ${veh.year || item.year ? `(${veh.year || item.year})` : ''}</p>
                    <div class="flex items-center justify-between mt-3 border-t border-blue-900 pt-2 text-xs text-blue-200">
                        <span>Pemilik: ${item.customer_name || 'Umum / Non-Member'}</span>
                        <span>Warna: ${veh.color || item.color || '-'}</span>
                    </div>
                </div>

                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider px-1">Daftar Riwayat Service (${services.length})</h2>

                <!-- Services Container -->
                <div class="flex flex-col gap-3">
                    ${services.length === 0 ? `
                        <div class="bg-white rounded-2xl p-8 border border-slate-200 text-center text-slate-500">
                            <span class="material-symbols-outlined text-4xl text-slate-400 mb-2">build_circle</span>
                            <p class="font-semibold text-sm">Belum Ada Riwayat Service</p>
                            <p class="text-xs mt-1">Kendaraan ini belum memiliki transaksi service tercatat.</p>
                        </div>
                    ` : services.map(s => {
                        let statusColor = 'bg-amber-100 text-amber-800 border-amber-200';
                        if (s.status === 'Selesai' || s.status === 'Diambil') statusColor = 'bg-emerald-100 text-emerald-800 border-emerald-200';
                        if (s.status === 'Proses') statusColor = 'bg-blue-100 text-blue-800 border-blue-200';
                        if (s.status === 'Dibatalkan') statusColor = 'bg-red-100 text-red-800 border-red-200';

                        const formattedCost = s.total_cost ? new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(s.total_cost) : '';

                        return `
                            <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm hover:border-blue-300 transition-all cursor-pointer active:scale-[0.99]" onclick="viewDetail(${s.id})">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-xs font-bold text-slate-400 tracking-wider">${s.service_code}</span>
                                    <span class="text-[11px] font-extrabold px-2.5 py-0.5 rounded-full border ${statusColor}">${s.status}</span>
                                </div>
                                <h3 class="font-bold text-slate-900 text-base mb-1">${s.service_type}</h3>
                                <div class="flex items-center justify-between text-xs text-slate-500">
                                    <span class="flex items-center gap-1"><span class="material-symbols-outlined text-sm">calendar_today</span>${s.service_date}</span>
                                    <span class="font-extrabold text-blue-950">${formattedCost || `Mekanik: ${s.mechanic || '-'}`}</span>
                                </div>
                                ${s.complaint ? `<p class="text-xs text-slate-600 bg-slate-50 p-2 rounded-xl mt-2 border border-slate-100">Keluhan: ${s.complaint}</p>` : ''}
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        });

        function viewDetail(id) {
            sessionStorage.setItem('cs_selected_service_id', id);
            window.location.href = `detail.html?id=${id}`;
        }
    </script>
</body>
</html>
