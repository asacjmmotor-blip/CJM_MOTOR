<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Hasil Riwayat Service - CJM Motor</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 h-16 flex items-center justify-between max-w-lg mx-auto w-full">
        <a href="index.html" class="flex items-center gap-2 text-slate-700 hover:text-blue-900 font-semibold text-sm">
            <span class="material-symbols-outlined">arrow_back</span>
            <span>Kembali</span>
        </a>
        <h1 class="font-bold text-blue-950 text-base">Riwayat Service</h1>
        <div class="w-6"></div>
    </header>

    <main class="flex-grow p-4 w-full max-w-lg mx-auto flex flex-col gap-4">
        <!-- Vehicle Info Card -->
        <div class="bg-blue-900 text-white rounded-2xl p-5 shadow-sm">
            <div class="flex items-center justify-between mb-2">
                <span id="veh-plate" class="text-xl font-extrabold tracking-wider uppercase">B 1234 ABC</span>
                <span class="material-symbols-outlined text-blue-200">two_wheeler</span>
            </div>
            <p id="veh-info" class="text-sm font-medium text-blue-100">Honda Beat (2024)</p>
            <p id="veh-color" class="text-xs text-blue-200 mt-1">Warna: Hitam</p>
        </div>

        <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider px-1">Daftar Riwayat Service</h2>

        <!-- Services Container -->
        <div id="services-list" class="flex flex-col gap-3">
            <!-- Dynamic content inserted via JS -->
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dataRaw = sessionStorage.getItem('cs_search_result');
            if (!dataRaw) {
                window.location.href = 'index.html';
                return;
            }

            const data = JSON.parse(dataRaw);
            const veh = data.vehicle;
            const services = data.services || [];

            document.getElementById('veh-plate').textContent = veh.plate_number;
            document.getElementById('veh-info').textContent = `${veh.brand} ${veh.model}` + (veh.year ? ` (${veh.year})` : '');
            document.getElementById('veh-color').textContent = `Warna: ${veh.color || '-'}`;

            const listEl = document.getElementById('services-list');
            if (services.length === 0) {
                listEl.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 border border-slate-200 text-center text-slate-500">
                        <span class="material-symbols-outlined text-4xl text-slate-400 mb-2">build_circle</span>
                        <p class="font-semibold text-sm">Belum Ada Riwayat Service</p>
                        <p class="text-xs mt-1">Kendaraan ini belum pernah melakukan service di bengkel.</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = services.map(s => {
                let statusColor = 'bg-yellow-100 text-yellow-800';
                if (s.status === 'Selesai' || s.status === 'Diambil') statusColor = 'bg-emerald-100 text-emerald-800';
                if (s.status === 'Dikerjakan') statusColor = 'bg-blue-100 text-blue-800';
                if (s.status === 'Dibatalkan') statusColor = 'bg-red-100 text-red-800';

                return `
                    <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm hover:border-blue-300 transition-colors cursor-pointer" onclick="viewDetail(${s.id})">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold text-slate-400">${s.service_code}</span>
                            <span class="text-xs font-bold px-2.5 py-1 rounded-full ${statusColor}">${s.status}</span>
                        </div>
                        <h3 class="font-bold text-slate-900 text-base">${s.service_type}</h3>
                        <p class="text-xs text-slate-500 mt-1 flex items-center gap-1">
                            <span class="material-symbols-outlined text-sm">calendar_today</span>
                            <span>${s.service_date}</span>
                            ${s.mechanic ? `<span class="ml-2 font-medium">• Mekanik: ${s.mechanic}</span>` : ''}
                        </p>
                        ${s.complaint ? `<p class="text-xs text-slate-600 bg-slate-50 p-2 rounded-lg mt-2 border border-slate-100">Keluhan: ${s.complaint}</p>` : ''}
                    </div>
                `;
            }).join('');
        });

        function viewDetail(id) {
            sessionStorage.setItem('cs_selected_service_id', id);
            window.location.href = 'detail.html';
        }
    </script>
</body>
</html>
