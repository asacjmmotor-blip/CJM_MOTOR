<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="theme-color" content="#1e3a8a"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <title>CJM Motor - Pencarian Riwayat Service</title>
    <link rel="manifest" href="/manifest.json"/>
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <link rel="stylesheet" href="../assets/css/style.css"/>
    <link rel="stylesheet" href="../assets/css/mobile.css"/>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">
    <main class="flex-grow flex flex-col justify-center items-center p-4 md:p-6 w-full max-w-lg mx-auto">
        <!-- Logo / Title -->
        <div class="mb-8 text-center flex flex-col items-center">
            <img src="/assets/icons/icon-192.png" alt="Asa Utama Motor Logo" class="w-20 h-20 rounded-full mb-3 shadow-md object-cover border-2 border-blue-900"/>
            <h1 class="text-2xl md:text-3xl font-extrabold text-blue-950 uppercase tracking-wide">ASA UTAMA MOTOR</h1>
            <p class="text-xs text-slate-500 mt-1 font-bold uppercase tracking-wider">Racing Team by CJM Group</p>
        </div>

        <!-- Search Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 w-full p-6 md:p-8">
            <form id="search-form" class="flex flex-col gap-5" onsubmit="event.preventDefault(); openPinModal();">
                <div class="flex flex-col gap-4">
                    <!-- 1. Nomor Polisi Kendaraan -->
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-bold text-slate-600 tracking-wider uppercase" for="nopol">NOMOR POLISI KENDARAAN</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">pin_drop</span>
                            <input autocomplete="off" class="nopol-input w-full h-12 border border-slate-300 rounded-xl px-12 bg-slate-50 text-base font-extrabold text-blue-950 uppercase tracking-widest focus:border-blue-900 focus:ring-1 focus:ring-blue-900 outline-none transition-colors" id="nopol" name="nopol" placeholder="B 1234 ABC" required type="text" oninput="document.getElementById('error-message').classList.add('hidden')"/>
                        </div>
                    </div>

                    <p class="text-xs text-red-600 hidden text-center mt-1 font-semibold" id="error-message"></p>
                </div>

                <button class="h-12 bg-blue-900 text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-blue-800 transition-colors active:scale-[0.98]" id="search-btn" type="submit">
                    <span class="material-symbols-outlined" id="search-btn-icon">search</span>
                    <span id="search-btn-text">CARI RIWAYAT SERVICE</span>
                </button>
            </form>
        </div>

        <div class="mt-8 text-center px-4">
            <p class="text-xs text-slate-500">
                Akses Internal Bengkel: <a class="text-blue-900 font-bold hover:underline" href="../admin/login.html">Login Portal Admin</a>
            </p>
        </div>
    </main>

    <!-- Modal Popup PIN Akses -->
    <div id="pin-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs transition-opacity duration-300 opacity-0" onclick="if(event.target === this) closePinModal();">
        <div id="pin-modal-card" class="bg-white rounded-3xl shadow-2xl border border-slate-100 max-w-sm w-full p-6 relative transform transition-all duration-300 scale-95 opacity-0 flex flex-col items-center text-center">
            
            <!-- Close Button -->
            <button onclick="closePinModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:text-slate-800 flex items-center justify-center transition-colors outline-none" title="Tutup">
                <span class="material-symbols-outlined text-lg">close</span>
            </button>

            <!-- Modal Header Icon -->
            <div class="w-16 h-16 rounded-2xl bg-amber-50 border border-amber-200 flex items-center justify-center mb-3 text-amber-600 shadow-sm">
                <span class="material-symbols-outlined text-3xl font-bold">lock</span>
            </div>

            <!-- Title & Badge -->
            <h3 class="text-lg font-extrabold text-blue-950">Masukkan PIN Akses</h3>
            <p class="text-xs text-slate-500 mt-0.5">Plat Kendaraan:</p>
            <div class="inline-flex items-center gap-1.5 bg-blue-50 border border-blue-200/80 text-blue-950 font-black tracking-widest px-3 py-1 rounded-lg text-sm mt-1 mb-2 uppercase" id="modal-nopol-badge">
                <span class="material-symbols-outlined text-sm text-blue-700">directions_car</span>
                <span id="badge-nopol-text">B 1234 ABC</span>
            </div>

            <p class="text-xs text-slate-600 mb-4 px-2 leading-relaxed">
                Masukkan 4-digit PIN unik yang diberikan oleh Admin Bengkel untuk melihat riwayat service.
            </p>

            <!-- PIN Form inside Modal -->
            <form class="w-full flex flex-col gap-4" onsubmit="event.preventDefault(); submitSearchWithPin();">
                <div class="relative">
                    <input 
                        autocomplete="off" 
                        class="w-full h-14 border-2 border-amber-300 rounded-2xl bg-amber-50/50 text-center font-extrabold text-2xl tracking-[0.5em] text-blue-950 focus:border-blue-900 focus:ring-4 focus:ring-blue-900/10 outline-none transition-all placeholder:tracking-normal placeholder:text-slate-400 placeholder:text-sm" 
                        id="modal-pin" 
                        name="pin" 
                        placeholder="----" 
                        maxlength="4" 
                        pattern="[0-9]*" 
                        inputmode="numeric"
                        type="password" 
                        oninput="onModalPinInput()"
                    />
                </div>

                <p class="text-xs text-red-600 hidden text-center font-semibold" id="modal-error-message"></p>

                <button class="h-12 bg-blue-900 text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-blue-800 transition-all active:scale-[0.98] shadow-md shadow-blue-900/20" id="modal-submit-btn" type="submit">
                    <span class="material-symbols-outlined">key</span>
                    <span>VERIFIKASI & CARI</span>
                </button>
            </form>

            <button onclick="closePinModal()" class="mt-3 text-xs font-bold text-slate-400 hover:text-slate-600 transition-colors">
                Batal / Ganti Plat Nomor
            </button>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/cs.js"></script>
    <script src="../assets/js/pwa.js"></script>
    <script>
        if (typeof formatPlateInput === 'function') {
            formatPlateInput(document.getElementById('nopol'));
        }

        function openPinModal() {
            const nopolInput = document.getElementById('nopol');
            const errorMsg = document.getElementById('error-message');
            const modalErrorMsg = document.getElementById('modal-error-message');
            const modalPinInput = document.getElementById('modal-pin');
            
            errorMsg.classList.add('hidden');
            modalErrorMsg.classList.add('hidden');
            modalPinInput.value = '';

            const val = nopolInput.value.trim().replace(/\s+/g, '');
            if (!val || val.length < 3) {
                errorMsg.textContent = 'Masukkan nomor polisi yang valid (minimal 3 karakter).';
                errorMsg.classList.remove('hidden');
                nopolInput.focus();
                return;
            }

            document.getElementById('badge-nopol-text').textContent = nopolInput.value.toUpperCase().trim();
            
            const modal = document.getElementById('pin-modal');
            const card = document.getElementById('pin-modal-card');

            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                modal.classList.add('opacity-100');
                card.classList.remove('scale-95', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
            });

            setTimeout(() => {
                modalPinInput.focus();
            }, 150);
        }

        function closePinModal() {
            const modal = document.getElementById('pin-modal');
            const card = document.getElementById('pin-modal-card');

            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-95', 'opacity-0');

            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function onModalPinInput() {
            const modalErrorMsg = document.getElementById('modal-error-message');
            modalErrorMsg.classList.add('hidden');
        }

        async function submitSearchWithPin() {
            const nopolInput = document.getElementById('nopol');
            const modalPinInput = document.getElementById('modal-pin');
            const modalErrorMsg = document.getElementById('modal-error-message');
            const btn = document.getElementById('modal-submit-btn');

            modalErrorMsg.classList.add('hidden');
            const val = nopolInput.value.trim().replace(/\s+/g, '');
            const pinVal = modalPinInput.value.trim();

            if (!pinVal || pinVal.length < 4) {
                modalErrorMsg.textContent = 'PIN Akses 4-digit wajib diisi.';
                modalErrorMsg.classList.remove('hidden');
                modalPinInput.focus();
                return;
            }

            const originalContent = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span><span>Memverifikasi...</span>`;
            btn.disabled = true;

            try {
                const res = await apiRequest(`/vehicles/search?q=${encodeURIComponent(val)}&pin=${encodeURIComponent(pinVal)}`);
                if (res.success && res.data && res.data.length > 0) {
                    sessionStorage.setItem('cs_search_result', JSON.stringify(res.data[0]));
                    window.location.href = `/cs/result.html?q=${encodeURIComponent(val)}&pin=${encodeURIComponent(pinVal)}`;
                } else {
                    modalErrorMsg.textContent = `Nomor Polisi "${val}" atau PIN Akses 4-digit tidak sesuai. Silakan minta PIN ke Admin.`;
                    modalErrorMsg.classList.remove('hidden');
                }
            } catch (err) {
                modalErrorMsg.textContent = err.message || 'Nomor Polisi atau PIN Akses 4-digit tidak sesuai.';
                modalErrorMsg.classList.remove('hidden');
            } finally {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const modal = document.getElementById('pin-modal');
                if (modal && !modal.classList.contains('hidden')) {
                    closePinModal();
                }
            }
        });
    </script>
</body>
</html>
