<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CJM Motor - Pencarian Riwayat Service</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <link rel="stylesheet" href="../assets/css/style.css"/>
    <link rel="stylesheet" href="../assets/css/mobile.css"/>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">
    <main class="flex-grow flex flex-col justify-center items-center p-4 md:p-6 w-full max-w-lg mx-auto">
        <!-- Logo / Title -->
        <div class="mb-8 text-center flex flex-col items-center">
            <div class="w-20 h-20 bg-blue-900 text-white rounded-full flex items-center justify-center mb-3 shadow-md">
                <span class="material-symbols-outlined text-[44px]">two_wheeler</span>
            </div>
            <h1 class="text-2xl md:text-3xl font-extrabold text-blue-950">ASA MOTOR</h1>
            <p class="text-sm text-slate-600 mt-1 font-medium">By CJM Group</p>
        </div>

        <!-- Search Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 w-full p-6 md:p-8">
            <form id="search-form" class="flex flex-col gap-5" onsubmit="event.preventDefault(); handleSearch();">
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-slate-500 tracking-wider text-center uppercase" for="nopol">MASUKKAN NOMOR POLISI</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">pin_drop</span>
                        <input autocomplete="off" class="nopol-input w-full h-12 border border-slate-300 rounded-xl px-12 bg-slate-50 text-lg font-extrabold text-blue-950 uppercase tracking-widest focus:border-blue-900 focus:ring-1 focus:ring-blue-900 outline-none transition-colors" id="nopol" name="nopol" placeholder="B 1234 ABC" required type="text"/>
                    </div>
                    <p class="text-xs text-red-600 hidden text-center mt-1 font-semibold" id="error-message"></p>
                </div>
                <button class="h-12 bg-blue-900 text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-blue-800 transition-colors active:scale-[0.98]" id="search-btn" type="submit">
                    <span class="material-symbols-outlined">search</span>
                    <span>CEK RIWAYAT SERVICE</span>
                </button>
            </form>
        </div>

        <div class="mt-8 text-center px-4">
            <p class="text-xs text-slate-500">
                Akses Internal Bengkel: <a class="text-blue-900 font-bold hover:underline" href="../admin/login.html">Login Portal Admin</a>
            </p>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/cs.js"></script>
    <script>
        if (typeof formatPlateInput === 'function') {
            formatPlateInput(document.getElementById('nopol'));
        }

        async function handleSearch() {
            const nopolInput = document.getElementById('nopol');
            const errorMsg = document.getElementById('error-message');
            const btn = document.getElementById('search-btn');
            
            errorMsg.classList.add('hidden');
            const val = nopolInput.value.trim();

            if (!val) {
                errorMsg.textContent = 'Nomor polisi wajib diisi.';
                errorMsg.classList.remove('hidden');
                return;
            }

            const originalContent = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span><span>Mencari...</span>`;
            btn.disabled = true;

            try {
                const res = await apiRequest(`/vehicles/search?q=${encodeURIComponent(val)}`);
                if (res.success && res.data && res.data.length > 0) {
                    sessionStorage.setItem('cs_search_result', JSON.stringify(res.data[0]));
                    window.location.href = `/cs/result.html?q=${encodeURIComponent(val)}`;
                } else {
                    errorMsg.textContent = `Nomor Polisi "${val}" belum memiliki riwayat di database.`;
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = err.message || 'Nomor Polisi tidak ditemukan.';
                errorMsg.classList.remove('hidden');
            } finally {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
