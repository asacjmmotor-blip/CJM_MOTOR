<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="theme-color" content="#1e3a8a"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <title>CJM Motor - Pencarian Riwayat Service</title>
    <link rel="manifest" href="/manifest.json"/>
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <link rel="stylesheet" href="../assets/css/style.css"/>
    <link rel="stylesheet" href="../assets/css/mobile.css"/>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">
    <main class="flex-grow flex flex-col justify-center items-center p-4 md:p-6 w-full max-w-lg mx-auto">
        <!-- Logo / Title -->
        <div class="mb-8 text-center flex flex-col items-center">
            <img src="/assets/icons/icon-192.png" alt="Asa Utama Motor Logo" class="w-20 h-20 rounded-full mb-3 shadow-md object-cover border-2 border-blue-900"/>
            <h1 class="text-2xl md:text-3xl font-extrabold text-blue-950 uppercase tracking-wide">ASA UTAMA MOTOR</h1>
            <p class="text-xs text-slate-500 mt-1 font-bold uppercase tracking-wider">Racing Team by CJM Group</p>
        </div>

        <!-- Search Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 w-full p-6 md:p-8">
            <form id="search-form" class="flex flex-col gap-5" onsubmit="event.preventDefault(); handleSearch();">
                <div class="flex flex-col gap-4">
                    <!-- 1. Nomor Polisi Kendaraan -->
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-bold text-slate-600 tracking-wider uppercase" for="nopol">1. NOMOR POLISI KENDARAAN</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">pin_drop</span>
                            <input autocomplete="off" class="nopol-input w-full h-12 border border-slate-300 rounded-xl px-12 bg-slate-50 text-base font-extrabold text-blue-950 uppercase tracking-widest focus:border-blue-900 focus:ring-1 focus:ring-blue-900 outline-none transition-colors" id="nopol" name="nopol" placeholder="B 1234 ABC" required type="text" oninput="checkNopolLive()"/>
                        </div>
                    </div>

                    <!-- 2. Pop Bar PIN (Tersembunyi Awalnya, Pop Up Ketika Klik Cari Nopol) -->
                    <div id="pin-container" class="hidden flex flex-col gap-1.5 transition-all duration-300 transform translate-y-[-10px] opacity-0">
                        <div class="p-3 rounded-xl bg-amber-50 border border-amber-200/80 flex items-center gap-2 text-amber-900 text-xs font-semibold">
                            <span class="material-symbols-outlined text-amber-600 text-base shrink-0">key</span>
                            <span>Plat terdeteksi! Masukkan PIN 4-digit yang diberikan Admin:</span>
                        </div>
                        <label class="text-xs font-bold text-slate-600 tracking-wider uppercase mt-1" for="pin">2. PIN AKSES 4 DIGIT</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-amber-600 font-bold">lock</span>
                            <input autocomplete="off" class="w-full h-12 border border-amber-300 rounded-xl px-12 bg-amber-50/50 text-base font-extrabold text-blue-950 tracking-widest focus:border-blue-900 focus:ring-2 focus:ring-blue-900/20 outline-none transition-all" id="pin" name="pin" placeholder="1234" maxlength="4" pattern="[0-9]*" type="text" oninput="checkPinLive()"/>
                        </div>
                    </div>

                    <p class="text-xs text-red-600 hidden text-center mt-1 font-semibold" id="error-message"></p>
                </div>

                <button class="h-12 bg-blue-900 text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-blue-800 transition-colors active:scale-[0.98]" id="search-btn" type="submit">
                    <span class="material-symbols-outlined" id="search-btn-icon">search</span>
                    <span id="search-btn-text">CARI RIWAYAT SERVICE</span>
                </button>
            </form>
        </div>

        <div class="mt-8 text-center px-4">
            <p class="text-xs text-slate-500">
                Akses Internal Bengkel: <a class="text-blue-900 font-bold hover:underline" href="../admin/login.html">Login Portal Admin</a>
            </p>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/cs.js"></script>
    <script src="../assets/js/pwa.js"></script>
    <script>
        if (typeof formatPlateInput === 'function') {
            formatPlateInput(document.getElementById('nopol'));
        }

        function checkNopolLive() {
            const nopolInput = document.getElementById('nopol');
            const pinContainer = document.getElementById('pin-container');
            const errorMsg = document.getElementById('error-message');
            const btnText = document.getElementById('search-btn-text');
            const btnIcon = document.getElementById('search-btn-icon');
            
            errorMsg.classList.add('hidden');
            const val = nopolInput.value.trim().replace(/\s+/g, '');

            // Reset PIN container if Nopol becomes too short or cleared
            if (val.length < 3 && !pinContainer.classList.contains('hidden')) {
                pinContainer.classList.remove('translate-y-0', 'opacity-100');
                pinContainer.classList.add('translate-y-[-10px]', 'opacity-0');
                setTimeout(() => pinContainer.classList.add('hidden'), 200);

                btnText.textContent = 'CARI RIWAYAT SERVICE';
                btnIcon.textContent = 'search';
            }
        }

        function checkPinLive() {
            const errorMsg = document.getElementById('error-message');
            errorMsg.classList.add('hidden');
        }

        async function handleSearch() {
            const nopolInput = document.getElementById('nopol');
            const pinInput = document.getElementById('pin');
            const pinContainer = document.getElementById('pin-container');
            const errorMsg = document.getElementById('error-message');
            const btn = document.getElementById('search-btn');
            const btnText = document.getElementById('search-btn-text');
            const btnIcon = document.getElementById('search-btn-icon');
            
            errorMsg.classList.add('hidden');
            const val = nopolInput.value.trim().replace(/\s+/g, '');
            const pinVal = pinInput.value.trim();

            if (!val || val.length < 3) {
                errorMsg.textContent = 'Masukkan nomor polisi yang valid (minimal 3 karakter).';
                errorMsg.classList.remove('hidden');
                nopolInput.focus();
                return;
            }

            // LANGKAH 1: Jika container PIN belum muncul, tampilkan container PIN saat pencarian diklik
            if (pinContainer.classList.contains('hidden')) {
                pinContainer.classList.remove('hidden');
                requestAnimationFrame(() => {
                    pinContainer.classList.remove('translate-y-[-10px]', 'opacity-0');
                    pinContainer.classList.add('translate-y-0', 'opacity-100');
                });
                pinInput.focus();
                btnText.textContent = 'CEK RIWAYAT SERVICE';
                btnIcon.textContent = 'key';
                return; // Tunggu user memasukkan PIN 4 digit
            }

            // LANGKAH 2: Jika container PIN sudah muncul, validasi 4-digit PIN
            if (!pinVal || pinVal.length < 4) {
                errorMsg.textContent = 'PIN Akses 4-digit wajib diisi.';
                errorMsg.classList.remove('hidden');
                pinInput.focus();
                return;
            }

            // LANGKAH 3: Jalankan pencarian ke API
            const originalContent = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span><span>Mencari...</span>`;
            btn.disabled = true;

            try {
                const res = await apiRequest(`/vehicles/search?q=${encodeURIComponent(val)}&pin=${encodeURIComponent(pinVal)}`);
                if (res.success && res.data && res.data.length > 0) {
                    sessionStorage.setItem('cs_search_result', JSON.stringify(res.data[0]));
                    window.location.href = `/cs/result.html?q=${encodeURIComponent(val)}&pin=${encodeURIComponent(pinVal)}`;
                } else {
                    errorMsg.textContent = `Nomor Polisi "${val}" atau PIN Akses 4-digit tidak sesuai. Silakan minta PIN ke Admin.`;
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = err.message || 'Nomor Polisi atau PIN Akses 4-digit tidak sesuai.';
                errorMsg.classList.remove('hidden');
            } finally {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
